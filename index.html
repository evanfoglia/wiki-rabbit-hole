<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wiki Rabbit Hole</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="alternate icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9d8df7" />
            <stop offset="1" stop-color="#5b4fd6" />
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="14" fill="url(#logoGrad)" />
        <path d="M16 6.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" />
        <circle cx="16" cy="16" r="3.4" fill="#fff" />
      </svg>
    </span>
    <span>Wiki Rabbit Hole</span>
  </div>
  <form id="searchForm" class="search" autocomplete="off">
    <div class="searchWrap">
      <input id="searchInput" type="search" placeholder="Search Wikipedia…  ( / )" aria-label="Search Wikipedia"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <div id="suggest" class="hidden" role="listbox" aria-label="Search suggestions"></div>
    </div>
    <button type="submit">Dive</button>
    <button type="button" id="randomBtn" class="ghost" title="Random article" aria-label="Random article"><span aria-hidden="true">🎲</span><span class="btnLabel"> Random</span></button>
  </form>
</header>

<div class="stage">
  <canvas id="graph"></canvas>
  <aside id="panel" class="hidden" aria-live="polite">
    <button id="panelClose" class="ghost" aria-label="Close panel">✕</button>
    <img id="panelThumb" alt="" class="hidden" />
    <h2 id="panelTitle"></h2>
    <p id="panelMeta" class="meta"></p>
    <p id="panelSummary"></p>
    <a id="panelLink" target="_blank" rel="noopener">Open on Wikipedia ↗</a>
  </aside>
  <div id="hint">Click a node to dig deeper · drag to rearrange · scroll or pinch to zoom</div>
</div>

<footer class="bottombar">
  <div id="trail" aria-label="Your path"></div>
  <div id="stats"></div>
</footer>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
  data-cf-beacon='{"token": "63cbe8058eec48c1b332a81b71d1c8d0"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
